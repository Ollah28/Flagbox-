# Indicator parameters. This file is the ONLY place thresholds live (SPEC 3.2, CLAUDE.md).
# Indicator tools take just a buyer and a date range; the model cannot pass or change anything here.
# Every block must carry a `source:` or `rationale:` line, or the server refuses to start.

# Output size limits (CLAUDE.md: cap tool outputs at about 4k tokens, return totals + `truncated`).
limits:
  max_output_tokens: 4000
  max_title_chars: 80
  rationale: >
    The model runs with a 16k context window (SPEC D6). Each tool result is capped near 4k tokens
    so four or five results still leave room for the prompt and the model's own turns.

# Values the statistics must not trust (SPEC 3.2 "Extreme values").
data_quality:
  currency: KES
  value_sanity_cap_kes: 10000000000
  min_joint_coverage: 0.60
  rationale: >
    ASSUMPTION, chosen from the 2023-2025 snapshot: 3 of 67,944 positive awards exceed KES 10 billion
    and together carry 18% of all award value, so they would dominate any share calculation. Awards
    above the cap, in another currency, or with a value of zero are left out of statistics and counted
    as data-quality notes. They are never integrity flags. An indicator counts as runnable for a buyer
    and range only when at least `min_joint_coverage` (SPEC 3.2: 60%) of the awards have every field it
    needs.

indicators:
  repeat_winner:
    min_wins: 3
    min_value_share: 0.10
    max_hits: 5
    max_ocids_per_hit: 8
    rationale: >
      Decided 11 Oct (SPEC D23). A supplier is listed when it has at least 3 awards from the buyer and at
      least 10% of the buyer's award value in the date range. The SPEC placeholder of 30% fired at 1 of 240
      buyers with 50+ awards in the snapshot; 10% fires at 6 (docs/data_coverage.md), so it is the highest
      share that still gives the agent something to triage. Still an ASSUMPTION until checked against the
      OCP red-flag guidance. max_hits and max_ocids_per_hit only limit how much is shown to the model.
